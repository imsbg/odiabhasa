  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #FFF9F2;
      --header-brown: #FF7043;
      --card-bg: #FFFFFF;
      --border: #FFE0B2;
      --footer-bg: #FFF8EE;
      --text: #2D241E;
      --text-sec: #6E6259;
      --orange: #FF6D00;
      --green: #2E7D32;
      --red: #D32F2F;
      --new-badge: #E91E63;
      --custom-badge: #00897B;
      --font: 'Noto Sans Oriya', system-ui, -apple-system, sans-serif;
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body.no-scroll { overflow: hidden; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      color: inherit;
    }

    /* --- Shell --- */
    .app-shell {
      max-width: 960px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* --- Sticky Interactive Header --- */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 249, 242, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .circle-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(45, 36, 30, 0.06);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: transform 0.18s var(--spring), background-color 0.2s ease;
    }
    .circle-btn:active { transform: scale(0.91); }
    .circle-btn.hidden { display: none; }

    .header-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
    }

    .header-title-row {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .header-title-row.hidden { display: none; }

    .header-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .invisible-shared { opacity: 0 !important; }

    .search-box {
      flex: 1;
      display: none;
      align-items: center;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 25px;
      height: 46px;
      padding: 0 14px;
      box-shadow: 0 2px 8px rgba(45, 36, 30, 0.05);
      animation: fadeSlide 0.22s var(--spring);
    }
    .search-box.active { display: flex; }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: var(--font);
      font-size: 16px;
      color: var(--text);
      caret-color: var(--header-brown);
      width: 100%;
    }
    .search-input::placeholder { color: var(--text-sec); }

    .search-clear {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sec);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .search-clear.visible { opacity: 1; pointer-events: auto; }

    /* --- Download Progress Banner --- */
    .dl-banner-wrap {
      padding: 0 20px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-8px);
      transition: max-height 0.3s var(--spring), opacity 0.25s ease, transform 0.3s var(--spring), margin 0.25s ease;
    }
    .dl-banner-wrap.visible {
      max-height: 110px;
      opacity: 1;
      transform: translateY(0);
      margin-bottom: 10px;
    }
    .dl-banner {
      background: var(--card-bg);
      border: 1.5px solid rgba(255, 109, 0, 0.4);
      border-radius: 16px;
      padding: 12px 14px;
    }
    .dl-banner-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .dl-pct { color: var(--orange); }
    .progress-track {
      height: 8px;
      border-radius: 50px;
      background: rgba(255, 109, 0, 0.15);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 50px;
      background: var(--orange);
      transition: width 0.2s ease;
    }

    /* --- Stage & Screens --- */
    .stage {
      flex: 1;
      position: relative;
      padding-bottom: 28px;
    }

    .screen {
      width: 100%;
      transition: opacity 0.34s var(--spring), transform 0.36s var(--spring);
      will-change: transform, opacity;
    }
    .screen.hidden { display: none; }

    #categoryScreen.fading-out {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }
    #gridScreen.entering {
      opacity: 0;
      transform: translateY(36px);
    }
    #gridScreen.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- Toolbar & Pills --- */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 20px 10px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-sec);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 50px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      transition: transform 0.15s var(--spring);
    }
    .pill:active { transform: scale(0.95); }
    .pill-white {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
    }
    .pill-orange {
      background: rgba(255, 109, 0, 0.12);
      border: 1px solid rgba(255, 109, 0, 0.3);
      color: var(--orange);
    }
    .pill-green {
      background: rgba(46, 125, 50, 0.12);
      border: 1px solid rgba(46, 125, 50, 0.3);
      color: var(--green);
    }

    .saved-group { display: inline-flex; align-items: center; gap: 8px; }
    .del-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(211, 47, 47, 0.12);
      color: var(--red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s var(--spring);
    }
    .del-circle:active { transform: scale(0.9); }

    /* --- Category Banner Cards --- */
    .category-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 4px 20px 24px;
    }
    @media (min-width: 720px) {
      .category-list { grid-template-columns: repeat(2, 1fr); }
    }

    .cat-banner {
      position: relative;
      width: 100%;
      height: 128px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      box-shadow: 0 4px 14px rgba(45, 36, 30, 0.05);
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      transition: transform 0.24s var(--spring), box-shadow 0.24s var(--spring), border-color 0.2s ease;
    }
    .cat-banner:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 112, 67, 0.14);
      border-color: #FFD180;
    }
    .cat-banner:active { transform: scale(0.98); }

    .cat-img-wrap {
      position: absolute;
      top: 0;
      right: 0;
      width: 65%;
      height: 100%;
      overflow: hidden;
      background: var(--footer-bg);
    }
    .cat-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.45s var(--spring);
    }
    .cat-img.loaded { opacity: 1; }
    .cat-banner:hover .cat-img.loaded { transform: scale(1.04); }

    .cat-fallback-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      background: var(--footer-bg);
    }

    .cat-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        #FFFFFF 0%,
        #FFFFFF 44%,
        rgba(255, 255, 255, 0.78) 68%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
    }

    .cat-content {
      position: relative;
      z-index: 2;
      height: 100%;
      width: 74%;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .cat-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .cat-badges:empty { display: none; }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 50px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .tag-pill.new { background: var(--new-badge); }
    .tag-pill.custom { background: var(--custom-badge); }

    .saved-mini {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 50px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--green);
      background: rgba(46, 125, 50, 0.14);
    }

    .cat-title {
      margin: 0;
      font-size: 23px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.28;
    }

    .cat-count {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--header-brown);
    }

    /* --- Items Grid --- */
    .grid-wrap { position: relative; min-height: 55vh; }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 4px 20px 28px;
    }
    @media (min-width: 640px) {
      .items-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 900px) {
      .items-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .item-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      aspect-ratio: 0.8;
      box-shadow: 0 3px 10px rgba(45, 36, 30, 0.045);
      cursor: pointer;
      transition: transform 0.24s var(--spring), box-shadow 0.24s var(--spring), border-color 0.2s ease;
      animation: cardPop 0.34s var(--spring) both;
    }
    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 112, 67, 0.14);
      border-color: #FFD180;
    }
    .item-card:active { transform: scale(0.96); }

    .item-img-wrap {
      flex: 1;
      min-height: 0;
      padding: 6px;
      display: flex;
    }
    .item-img-frame {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: var(--footer-bg);
    }
    .item-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.4s var(--spring);
    }
    .item-img.loaded { opacity: 1; }
    .item-card:hover .item-img.loaded { transform: scale(1.04); }

    .item-footer {
      background: var(--footer-bg);
      padding: 10px 10px 11px;
      text-align: center;
    }
    .item-odia {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .item-eng {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-sec);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Floating Update FAB --- */
    .update-fab {
      position: sticky;
      top: 72px;
      z-index: 30;
      margin: 0 auto 12px;
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--orange);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 50px;
      box-shadow: 0 8px 22px rgba(255, 109, 0, 0.35);
      animation: dropIn 0.32s var(--spring);
    }
    .update-fab.visible { display: flex; }

    /* --- Shimmer Skeletons --- */
    .shimmer {
      background: linear-gradient(110deg, #EDE4D8 25%, #FAF6F0 50%, #EDE4D8 75%);
      background-size: 200% 100%;
      animation: shimmerMove 1.45s linear infinite;
    }

    .shimmer-banner {
      height: 128px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .shimmer-card {
      border-radius: 22px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      aspect-ratio: 0.8;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Empty / Maintenance / Error States --- */
    .state-box {
      padding: 64px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .state-box.hidden { display: none; }
    .state-emoji { font-size: 54px; margin-bottom: 12px; }
    .state-text {
      font-size: 16px;
      color: var(--text-sec);
      line-height: 1.6;
      max-width: 340px;
      margin: 0;
    }
    .primary-btn {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--orange);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      padding: 11px 22px;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(255, 109, 0, 0.25);
      transition: transform 0.16s var(--spring);
    }
    .primary-btn:active { transform: scale(0.95); }

    /* --- Shared Floating Elements --- */
    .shared-title-ghost {
      position: fixed;
      z-index: 90;
      margin: 0;
      font-family: var(--font);
      font-weight: 700;
      font-size: 22px;
      color: var(--text);
      white-space: nowrap;
      pointer-events: none;
      transform-origin: top left;
      will-change: transform;
    }

    .flying-img-ghost {
      position: fixed;
      z-index: 120;
      object-fit: cover;
      pointer-events: none;
      will-change: left, top, width, height, border-radius;
      box-shadow: 0 12px 32px rgba(45, 36, 30, 0.22);
    }

    /* --- Detail Modal Sheet --- */
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .detail-overlay.open { display: flex; }

    .detail-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: opacity 0.3s var(--ease);
    }
    .detail-overlay.visible .detail-backdrop { opacity: 1; }

    .detail-sheet {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 720px;
      height: calc(100dvh - 28px);
      background: var(--bg);
      border-radius: 28px 28px 0 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(64px);
      transition: opacity 0.32s var(--spring), transform 0.38s var(--spring);
      display: flex;
      flex-direction: column;
    }
    .detail-overlay.visible .detail-sheet {
      opacity: 1;
      transform: translateY(0);
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .detail-hero-wrap {
      padding: 20px 16px 0;
      position: relative;
    }
    .detail-hero {
      width: 100%;
      height: 256px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background: var(--footer-bg);
      cursor: zoom-in;
    }
    .detail-hero.hidden-for-flight { opacity: 0; }
    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .zoom-hint-pill {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.62);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 50px;
      backdrop-filter: blur(4px);
    }

    .detail-close-btn {
      position: absolute;
      top: 28px;
      right: 24px;
      z-index: 10;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.48);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: transform 0.16s var(--spring), background 0.2s ease;
    }
    .detail-close-btn:active { transform: scale(0.9); }

    .detail-body { padding: 22px 24px 104px; }

    .detail-cat-chip {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 112, 67, 0.14);
      color: var(--header-brown);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 50px;
      margin-bottom: 8px;
    }
    .detail-odia {
      margin: 0;
      font-size: 31px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .detail-eng {
      margin: 4px 0 0;
      font-size: 18px;
      font-weight: 500;
      color: var(--text-sec);
    }
    .detail-sci {
      margin: 3px 0 0;
      font-size: 14px;
      font-style: italic;
      color: rgba(110, 98, 89, 0.82);
    }
    .detail-divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }
    .detail-desc {
      margin: 0;
      font-size: 18px;
      line-height: 1.65;
      color: var(--text);
    }

    .extra-card {
      margin-top: 20px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 16px;
    }
    .section-heading {
      margin: 0 0 12px;
      font-size: 19px;
      font-weight: 700;
      color: var(--header-brown);
    }
    .extra-row {
      display: flex;
      gap: 10px;
      padding: 5px 0;
      font-size: 15px;
      line-height: 1.5;
    }
    .extra-key {
      flex: 0 0 40%;
      font-weight: 700;
      color: var(--text);
    }
    .extra-val {
      flex: 1;
      color: var(--text-sec);
    }

    .facts-wrap { margin-top: 24px; }
    .fact-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 16px;
      line-height: 1.55;
    }

    .scroll-down-fab {
      position: absolute;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--header-brown);
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 50px;
      box-shadow: 0 8px 24px rgba(255, 112, 67, 0.36);
      white-space: nowrap;
      transition: opacity 0.25s ease, transform 0.3s var(--spring);
    }
    .scroll-down-fab.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* --- Full-Screen Zoomable Viewer --- */
    .zoom-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(0, 0, 0, 0.96);
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      opacity: 0;
      transition: opacity 0.25s var(--ease);
    }
    .zoom-overlay.open { display: flex; }
    .zoom-overlay.visible { opacity: 1; }

    .zoom-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
      transform-origin: center center;
    }

    .zoom-close {
      position: absolute;
      top: calc(24px + env(safe-area-inset-top, 0px));
      right: 20px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    .zoom-tip {
      position: absolute;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: rgba(255, 255, 255, 0.92);
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 50px;
      white-space: nowrap;
      pointer-events: none;
    }

    /* --- Alert Dialogs (Download / Delete) --- */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      z-index: 140;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.22s ease;
    }
    .dialog-overlay.open { display: flex; }
    .dialog-overlay.visible { opacity: 1; }

    .dialog-card {
      width: 100%;
      max-width: 380px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
      transform: scale(0.92);
      transition: transform 0.26s var(--spring);
    }
    .dialog-overlay.visible .dialog-card { transform: scale(1); }

    .dialog-title {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 700;
    }
    .dialog-desc {
      margin: 0 0 16px;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text-sec);
    }
    .dialog-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      font-weight: 700;
      margin-bottom: 10px;
      transition: transform 0.15s var(--spring);
    }
    .dialog-btn:active { transform: scale(0.97); }
    .btn-orange { background: var(--orange); color: #FFFFFF; }
    .btn-brown { background: var(--header-brown); color: #FFFFFF; }
    .btn-red { background: var(--red); color: #FFFFFF; }
    .btn-red-outline {
      background: transparent;
      border: 1.5px solid var(--red);
      color: var(--red);
    }
    .dialog-cancel-row { text-align: right; margin-top: 2px; }
    .dialog-cancel {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sec);
      padding: 6px 12px;
      border-radius: 10px;
    }

    /* --- Animations --- */
    @keyframes shimmerMove {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardPop {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- Interactive Header -->
    <header class="app-header">
      <button class="circle-btn hidden" id="backBtn" aria-label="ପଛକୁ ଯାଆନ୍ତୁ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
      </button>

      <div class="header-main">
        <div class="header-title-row" id="headerTitleRow">
          <h1 class="header-title" id="headerTitle">ଆସ ଜାଣିବା</h1>
          <button class="circle-btn hidden" id="searchBtn" aria-label="ଖୋଜନ୍ତୁ">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
            </svg>
          </button>
        </div>

        <div class="search-box" id="searchBox">
          <input type="search" id="searchInput" class="search-input" placeholder="ଖୋଜନ୍ତୁ..." autocomplete="off" />
          <button class="search-clear" id="searchClearBtn" aria-label="ସଫା କରନ୍ତୁ">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Download Progress Banner -->
    <div class="dl-banner-wrap" id="dlBannerWrap">
      <div class="dl-banner">
        <div class="dl-banner-top">
          <span id="dlStatusText">ଡାଉନଲୋଡ୍ ଚାଲିଛି...</span>
          <span class="dl-pct" id="dlPctText">୦%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="dlProgressFill"></div>
        </div>
      </div>
    </div>

    <!-- Maintenance Screen -->
    <div class="state-box hidden" id="maintenanceView">
      <div class="state-emoji">🛠️</div>
      <p class="state-text" id="maintenanceMsg">ସର୍ଭର ମେଣ୍ଟେନାନ୍ସ ଚାଲିଛି...</p>
    </div>

    <!-- Main Stage -->
    <main class="stage" id="mainStage">
      <!-- SCREEN 1: Category Banner List -->
      <section class="screen" id="categoryScreen">
        <div class="toolbar" id="categoryToolbar">
          <span class="toolbar-label">ବିଭାଗ ବାଛନ୍ତୁ</span>
          <div id="categoryOfflineSlot"></div>
        </div>

        <div class="category-list" id="categoryList"></div>

        <div class="state-box hidden" id="configErrorView">
          <div class="state-emoji">📡</div>
          <p class="state-text">ଇଣ୍ଟରନେଟ୍ ସଂଯୋଗ ନାହିଁ!<br />ଦୟାକରି ଇଣ୍ଟରନେଟ୍ ଚାଲୁ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।</p>
          <button class="primary-btn" id="retryConfigBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
            </svg>
            <span>ପୁନଃଚେଷ୍ଟା କରନ୍ତୁ</span>
          </button>
        </div>
      </section>

      <!-- SCREEN 2: Selected Category Items Grid -->
      <section class="screen hidden" id="gridScreen">
        <div class="toolbar" id="gridToolbar">
          <span class="pill pill-white" id="gridCountPill">ମୋଟ: ୦</span>
          <div id="gridOfflineSlot"></div>
        </div>

        <div class="grid-wrap">
          <button class="update-fab" id="updateFab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
            </svg>
            <span>ନୂଆ ତଥ୍ୟ ଆସିଛି - ଅପଡେଟ୍ କରନ୍ତୁ</span>
          </button>

          <div class="items-grid" id="itemsGrid"></div>

          <div class="state-box hidden" id="emptyItemsView">
            <div class="state-emoji">🔍</div>
            <p class="state-text" style="font-weight:700;font-size:18px;">କିଛି ମିଳିଲା ନାହିଁ!</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Detail Sheet Modal -->
  <div class="detail-overlay" id="detailOverlay" role="dialog" aria-modal="true">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <div class="detail-sheet" id="detailSheet">
      <button class="detail-close-btn" id="detailCloseBtn" aria-label="ବନ୍ଦ କରନ୍ତୁ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>

      <div class="detail-scroll" id="detailScroll">
        <div class="detail-hero-wrap">
          <div class="detail-hero" id="detailHero">
            <img id="detailHeroImg" alt="" />
            <span class="zoom-hint-pill">🔍 ବଡ଼ କରି ଦେଖନ୍ତୁ</span>
          </div>
        </div>

        <div class="detail-body" id="detailBody"></div>
      </div>

      <button class="scroll-down-fab" id="scrollDownFab">
        <span>ବିଶେଷ ତଥ୍ୟ ପାଇଁ ତଳକୁ ଯାଆନ୍ତୁ</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Full-Screen Zoom Viewer -->
  <div class="zoom-overlay" id="zoomOverlay">
    <img class="zoom-img" id="zoomImg" alt="" />
    <button class="zoom-close" id="zoomCloseBtn" aria-label="ବନ୍ଦ କରନ୍ତୁ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
    <div class="zoom-tip">🔍 ଜୁମ୍ କରିବାକୁ ଦୁଇଥର ଟ୍ୟାପ୍ କିମ୍ବା ପିଞ୍ଚ୍ କରନ୍ତୁ</div>
  </div>

  <!-- Offline Download / Delete Dialog -->
  <div class="dialog-overlay" id="actionDialog">
    <div class="dialog-card">
      <h2 class="dialog-title" id="dialogTitle"></h2>
      <p class="dialog-desc" id="dialogDesc"></p>
      <div id="dialogActions"></div>
      <div class="dialog-cancel-row">
        <button class="dialog-cancel" id="dialogCancelBtn">ବାତିଲ୍</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const APP_CONFIG_URL = 'https://imsbg.github.io/asa-janiba-data/app.json';
      const CACHE_NAME = 'asa-janiba-offline-v1';
      const LS_CONFIG_KEY = 'asa_janiba_app_config_v2';
      const LS_CAT_PREFIX = 'asa_janiba_cat_data_';
      const LS_DOWNLOADED_KEY = 'asa_janiba_downloaded_ids';

      const ICON_CHECK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
      const ICON_DL = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
      const ICON_TRASH = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

      // --- Odia Numeral Helper ---
      const ODIA_DIGITS = { '0':'୦','1':'୧','2':'୨','3':'୩','4':'୪','5':'୫','6':'୬','7':'୭','8':'୮','9':'୯' };
      function toOdia(val) {
        return String(val ?? '').replace(/[0-9]/g, d => ODIA_DIGITS[d] || d);
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function displayCategoryTitle(cat) {
        return cat.icon && cat.icon.trim() ? `${cat.icon.trim()} ${cat.title}` : cat.title;
      }

      // --- App State ---
      const state = {
        appConfig: { version: 0, maintenanceMode: false, maintenanceMessage: '', hiddenTabs: [], categories: [] },
        activeCategories: [],
        previews: {}, // { [catId]: { firstImage, itemCount } }
        selectedCategory: null,
        itemsList: [],
        isLoadingItems: false,
        isSearchActive: false,
        searchQuery: '',
        downloadedIds: new Set(),
        isDownloading: false,
        latestNetworkData: null,
        isUpdateAvailable: false,
        isTransitioning: false,
        activeItem: null,
        sourceImgEl: null,
        isZoomOpen: false
      };

      // --- DOM Refs ---
      const el = {
        backBtn: document.getElementById('backBtn'),
        headerTitleRow: document.getElementById('headerTitleRow'),
        headerTitle: document.getElementById('headerTitle'),
        searchBtn: document.getElementById('searchBtn'),
        searchBox: document.getElementById('searchBox'),
        searchInput: document.getElementById('searchInput'),
        searchClearBtn: document.getElementById('searchClearBtn'),

        dlBannerWrap: document.getElementById('dlBannerWrap'),
        dlStatusText: document.getElementById('dlStatusText'),
        dlPctText: document.getElementById('dlPctText'),
        dlProgressFill: document.getElementById('dlProgressFill'),

        maintenanceView: document.getElementById('maintenanceView'),
        maintenanceMsg: document.getElementById('maintenanceMsg'),
        mainStage: document.getElementById('mainStage'),

        categoryScreen: document.getElementById('categoryScreen'),
        categoryToolbar: document.getElementById('categoryToolbar'),
        categoryOfflineSlot: document.getElementById('categoryOfflineSlot'),
        categoryList: document.getElementById('categoryList'),
        configErrorView: document.getElementById('configErrorView'),
        retryConfigBtn: document.getElementById('retryConfigBtn'),

        gridScreen: document.getElementById('gridScreen'),
        gridToolbar: document.getElementById('gridToolbar'),
        gridCountPill: document.getElementById('gridCountPill'),
        gridOfflineSlot: document.getElementById('gridOfflineSlot'),
        updateFab: document.getElementById('updateFab'),
        itemsGrid: document.getElementById('itemsGrid'),
        emptyItemsView: document.getElementById('emptyItemsView'),

        detailOverlay: document.getElementById('detailOverlay'),
        detailBackdrop: document.getElementById('detailBackdrop'),
        detailSheet: document.getElementById('detailSheet'),
        detailCloseBtn: document.getElementById('detailCloseBtn'),
        detailScroll: document.getElementById('detailScroll'),
        detailHero: document.getElementById('detailHero'),
        detailHeroImg: document.getElementById('detailHeroImg'),
        detailBody: document.getElementById('detailBody'),
        scrollDownFab: document.getElementById('scrollDownFab'),

        zoomOverlay: document.getElementById('zoomOverlay'),
        zoomImg: document.getElementById('zoomImg'),
        zoomCloseBtn: document.getElementById('zoomCloseBtn'),

        actionDialog: document.getElementById('actionDialog'),
        dialogTitle: document.getElementById('dialogTitle'),
        dialogDesc: document.getElementById('dialogDesc'),
        dialogActions: document.getElementById('dialogActions'),
        dialogCancelBtn: document.getElementById('dialogCancelBtn')
      };

      // --- Persistent Storage Helpers ---
      function loadDownloadedIds() {
        try {
          const raw = localStorage.getItem(LS_DOWNLOADED_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          state.downloadedIds = new Set(Array.isArray(arr) ? arr : []);
        } catch {
          state.downloadedIds = new Set();
        }
      }

      function saveDownloadedIds() {
        try {
          localStorage.setItem(LS_DOWNLOADED_KEY, JSON.stringify([...state.downloadedIds]));
        } catch {}
      }

      function parseAppConfig(raw) {
        const obj = typeof raw === 'string' ? JSON.parse(raw) : raw;
        const hiddenTabs = Array.isArray(obj.hiddenTabs) ? obj.hiddenTabs : [];
        const categories = (Array.isArray(obj.categories) ? obj.categories : [])
          .filter(c => !c.hidden)
          .map((c, idx) => ({
            id: c.id || `cat_${idx}`,
            title: c.title || '',
            url: c.url || '',
            icon: c.icon || '',
            isNew: Boolean(c.isNew),
            tag: c.tag || ''
          }));
        return {
          version: Number(obj.version || 1),
          maintenanceMode: Boolean(obj.maintenanceMode),
          maintenanceMessage: obj.maintenanceMessage || '',
          hiddenTabs,
          categories
        };
      }

      function getCachedConfig() {
        try {
          const raw = localStorage.getItem(LS_CONFIG_KEY);
          return raw ? parseAppConfig(raw) : null;
        } catch {
          return null;
        }
      }

      function saveCachedConfig(rawText) {
        try { localStorage.setItem(LS_CONFIG_KEY, rawText); } catch {}
      }

      function parseCategoryData(rawText) {
        const parsed = typeof rawText === 'string' ? JSON.parse(rawText) : rawText;
        let version = 0;
        let arr = [];

        if (Array.isArray(parsed)) {
          arr = parsed;
        } else if (parsed && typeof parsed === 'object') {
          version = Number(parsed.version || 0);
          arr = parsed.items || parsed.data || [];
        }

        if (version === 0 && arr.length > 0 && arr[0].version) {
          version = Number(arr[0].version || 0);
        }

        const items = arr.map(obj => {
          const facts = [];
          const extraDetails = {};
          if (obj.details && typeof obj.details === 'object') {
            for (const [k, v] of Object.entries(obj.details)) {
              if (k === 'ବିଶେଷ_ତଥ୍ୟ' && Array.isArray(v)) {
                v.forEach(f => facts.push(String(f)));
              } else if (v !== null && v !== undefined && String(v).trim() !== '') {
                extraDetails[k] = String(v);
              }
            }
          }
          return {
            odiaName: obj.odiaName || 'Unknown',
            englishName: obj.name || 'Unknown',
            scientificName: obj.scientificName || '',
            image: obj.image || '',
            category: obj.category || '',
            descriptionOdia: obj.descriptionOdia || '',
            facts,
            extraDetails
          };
        });

        return { version, items, rawJson: typeof rawText === 'string' ? rawText : JSON.stringify(parsed) };
      }

      function getCachedCategory(catId) {
        try {
          const raw = localStorage.getItem(LS_CAT_PREFIX + catId);
          return raw ? parseCategoryData(raw) : null;
        } catch {
          return null;
        }
      }

      function saveCachedCategory(catId, rawJson) {
        try { localStorage.setItem(LS_CAT_PREFIX + catId, rawJson); } catch {}
      }

      async function fetchCategoryNetwork(cat) {
        if (!cat || !cat.url) return null;
        try {
          const res = await fetch(cat.url, { cache: 'no-store' });
          if (!res.ok) return null;
          const text = await res.text();
          return parseCategoryData(text);
        } catch {
          return null;
        }
      }

      async function cacheImageOffline(url) {
        if (!url) return;
        try {
          if ('caches' in window) {
            const cache = await caches.open(CACHE_NAME);
            const match = await cache.match(url);
            if (!match) {
              try {
                await cache.add(new Request(url, { mode: 'no-cors' }));
              } catch {}
            }
          }
          // Preload into browser cache as well
          await new Promise(resolve => {
            const img = new Image();
            img.onload = resolve;
            img.onerror = resolve;
            img.src = url;
          });
        } catch {}
      }

      // --- Header & Toolbar UI ---
      function updateHeader() {
        const inCategory = Boolean(state.selectedCategory);
        el.backBtn.classList.toggle('hidden', !inCategory && !state.isSearchActive);
        el.searchBtn.classList.toggle('hidden', !inCategory);

        el.headerTitle.textContent = inCategory
          ? displayCategoryTitle(state.selectedCategory)
          : 'ଆସ ଜାଣିବା';

        if (state.isSearchActive && inCategory) {
          el.headerTitleRow.classList.add('hidden');
          el.searchBox.classList.add('active');
          el.searchClearBtn.classList.toggle('visible', state.searchQuery.length > 0);
        } else {
          el.headerTitleRow.classList.remove('hidden');
          el.searchBox.classList.remove('active');
        }
      }

      function renderCategoryOfflinePill() {
        if (state.isDownloading || state.activeCategories.length === 0) {
          el.categoryOfflineSlot.innerHTML = '';
          return;
        }
        const allDone = state.activeCategories.every(c => state.downloadedIds.has(c.id));
        if (allDone) {
          el.categoryOfflineSlot.innerHTML = `
            <span class="pill pill-green">${ICON_CHECK}<span>ସବୁ ସେଭ୍ ହୋଇଛି</span></span>
          `;
        } else {
          el.categoryOfflineSlot.innerHTML = `
            <button class="pill pill-orange" id="dlAllBtn">${ICON_DL}<span>ସବୁ ଅଫଲାଇନ୍ ସେଭ୍</span></button>
          `;
          document.getElementById('dlAllBtn').onclick = openDownloadDialog;
        }
      }

      function renderGridOfflinePill() {
        const cat = state.selectedCategory;
        if (!cat || state.isLoadingItems || state.itemsList.length === 0 || state.isDownloading) {
          el.gridOfflineSlot.innerHTML = '';
          return;
        }
        if (state.downloadedIds.has(cat.id)) {
          el.gridOfflineSlot.innerHTML = `
            <div class="saved-group">
              <span class="pill pill-green">${ICON_CHECK}<span>ସେଭ୍ ହୋଇଛି</span></span>

      // --- Render Category List ---
      function renderCategories() {
        el.configErrorView.classList.add('hidden');
        el.categoryToolbar.classList.remove('hidden');
        renderCategoryOfflinePill();

        el.categoryList.innerHTML = state.activeCategories.map(cat => {
          const preview = state.previews[cat.id];
          const isSaved = state.downloadedIds.has(cat.id);
          const badgeText = cat.tag && cat.tag.trim() ? cat.tag.trim() : (cat.isNew ? 'ନୂତନ' : '');
          const badgeClass = badgeText === 'ନୂତନ' ? 'new' : 'custom';
          const countText = preview && preview.itemCount > 0
            ? `ମୋଟ ${toOdia(preview.itemCount)}ଟି • ଦେଖନ୍ତୁ →`
            : 'ଦେଖନ୍ତୁ →';

          const imgBlock = preview && preview.firstImage
            ? `<div class="cat-img-wrap shimmer">
                 <img class="cat-img" src="${escapeHtml(preview.firstImage)}" alt="${escapeHtml(cat.title)}" loading="lazy"
                      onload="this.classList.add('loaded');this.parentElement.classList.remove('shimmer');"
                      onerror="this.parentElement.classList.remove('shimmer');this.parentElement.innerHTML='<div class=\\'cat-fallback-icon\\'>${escapeHtml(cat.icon || '📘')}</div>';" />
               </div>`
            : `<div class="cat-img-wrap shimmer"></div>`;

          return `
            <button class="cat-banner" data-cat-id="${escapeHtml(cat.id)}">
              ${imgBlock}
              <div class="cat-fade"></div>
              <div class="cat-content">
                <div class="cat-badges">
                  ${badgeText ? `<span class="tag-pill ${badgeClass}">${escapeHtml(badgeText)}</span>` : ''}
                  ${isSaved ? `<span class="saved-mini">${ICON_CHECK} ସେଭ୍</span>` : ''}
                </div>
                <h2 class="cat-title">${escapeHtml(displayCategoryTitle(cat))}</h2>
                <div class="cat-count">${countText}</div>
              </div>
            </button>
          `;
        }).join('');

        el.categoryList.querySelectorAll('.cat-banner').forEach(card => {
          card.addEventListener('click', () => {
            const cat = state.activeCategories.find(c => c.id === card.dataset.catId);
            const titleEl = card.querySelector('.cat-title');
            if (cat) openCategory(cat, titleEl);
          });
        });
      }

      function updateSingleCategoryBanner(catId) {
        const card = el.categoryList.querySelector(`.cat-banner[data-cat-id="${CSS.escape(catId)}"]`);
        const preview = state.previews[catId];
        if (!card || !preview) return;

        const countEl = card.querySelector('.cat-count');
        if (countEl && preview.itemCount > 0) {
          countEl.textContent = `ମୋଟ ${toOdia(preview.itemCount)}ଟି • ଦେଖନ୍ତୁ →`;
        }
        const wrap = card.querySelector('.cat-img-wrap');
        if (wrap && preview.firstImage && !wrap.querySelector('img')) {
          const cat = state.activeCategories.find(c => c.id === catId);
          const img = document.createElement('img');
          img.className = 'cat-img';
          img.loading = 'lazy';
          img.alt = cat ? cat.title : '';
          img.src = preview.firstImage;
          img.onload = () => {
            img.classList.add('loaded');
            wrap.classList.remove('shimmer');
          };
          img.onerror = () => {
            wrap.classList.remove('shimmer');
            wrap.innerHTML = `<div class="cat-fallback-icon">${escapeHtml((cat && cat.icon) || '📘')}</div>`;
          };
          wrap.appendChild(img);
        }
      }

      // --- Render Items Grid ---
      function getFilteredItems() {
        const q = state.searchQuery.trim().toLowerCase();
        if (!q) return state.itemsList;
        return state.itemsList.filter(it =>
          it.odiaName.toLowerCase().includes(q) ||
          it.englishName.toLowerCase().includes(q)
        );
      }

      function renderItemsGrid() {
        if (state.isLoadingItems) {
          renderGridShimmers();
          return;
        }
        const displayed = getFilteredItems();

        if (displayed.length === 0) {
          el.gridToolbar.classList.toggle('hidden', state.itemsList.length === 0);
          el.gridCountPill.textContent = `ମୋଟ: ${toOdia(0)}`;
          el.itemsGrid.innerHTML = '';
          el.emptyItemsView.classList.remove('hidden');
          renderGridOfflinePill();
          return;
        }

        el.gridToolbar.classList.remove('hidden');
        el.emptyItemsView.classList.add('hidden');
        el.gridCountPill.textContent = `ମୋଟ: ${toOdia(displayed.length)}`;
        renderGridOfflinePill();

        el.itemsGrid.innerHTML = displayed.map((item, idx) => `
          <article class="item-card" data-idx="${idx}" style="animation-delay:${Math.min(idx * 25, 240)}ms">
            <div class="item-img-wrap">
              <div class="item-img-frame shimmer">

                     onerror="this.parentElement.classList.remove('shimmer');this.style.opacity=0.25;" />
              </div>
            </div>

              <div class="item-eng">${escapeHtml(item.englishName)}</div>

        el.itemsGrid.querySelectorAll('.item-card').forEach(card => {
          card.addEventListener('click', () => {

      // --- Shared Category Title Glide Transition ---
      function animateSharedTitle(text, fromRect, toRect, fromScale, toScale, onDone) {
        const ghost = document.createElement('div');
        ghost.className = 'shared-title-ghost';
        ghost.textContent = text;
        ghost.style.left = `${fromRect.left}px`;
        ghost.style.top = `${fromRect.top}px`;
        ghost.style.transform = `translate3d(0, 0, 0) scale(${fromScale})`;
        document.body.appendChild(ghost);

        const dx = toRect.left - fromRect.left;
        const dy = toRect.top - fromRect.top;

        requestAnimationFrame(() => {
          ghost.style.transition = 'transform 0.38s cubic-bezier(0.22, 1, 0.36, 1)';
          ghost.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${toScale})`;
        });

        setTimeout(() => {
          ghost.remove();
          onDone && onDone();
        }, 390);
      }

      async function openCategory(category, sourceTitleEl) {
        if (state.isTransitioning) return;
        state.isTransitioning = true;

        const sourceRect = sourceTitleEl ? sourceTitleEl.getBoundingClientRect() : null;
        state.selectedCategory = category;
        state.isSearchActive = false;
        state.searchQuery = '';
        el.searchInput.value = '';
        state.isUpdateAvailable = false;
        state.latestNetworkData = null;
        el.updateFab.classList.remove('visible');

        updateHeader();
        history.pushState({ view: 'grid', catId: category.id }, '');

        const headerRect = el.headerTitle.getBoundingClientRect();

        if (sourceRect && sourceTitleEl) {
          sourceTitleEl.classList.add('invisible-shared');
          el.headerTitle.classList.add('invisible-shared');
          animateSharedTitle(displayCategoryTitle(category), sourceRect, headerRect, 23 / 22, 1, () => {
            el.headerTitle.classList.remove('invisible-shared');
            sourceTitleEl.classList.remove('invisible-shared');
          });
        }

        el.categoryScreen.classList.add('fading-out');
        loadCategoryItems(category);

        setTimeout(() => {
          el.categoryScreen.classList.add('hidden');
          el.categoryScreen.classList.remove('fading-out');

          el.gridScreen.classList.remove('hidden');
          el.gridScreen.classList.add('entering');
          window.scrollTo({ top: 0, behavior: 'instant' });

          requestAnimationFrame(() => {
            el.gridScreen.classList.remove('entering');
            el.gridScreen.classList.add('active');
          });

          setTimeout(() => { state.isTransitioning = false; }, 340);
        }, 120);
      }

      function goBackToCategoryList() {
        if (state.isTransitioning || !state.selectedCategory) return;
        state.isTransitioning = true;
        const prevCat = state.selectedCategory;

        state.isSearchActive = false;
        state.searchQuery = '';
        el.searchInput.value = '';
        el.updateFab.classList.remove('visible');

        const headerRect = el.headerTitle.getBoundingClientRect();

        el.gridScreen.classList.remove('active');
        el.gridScreen.classList.add('entering');

        setTimeout(() => {
          el.gridScreen.classList.add('hidden');
          el.gridScreen.classList.remove('entering');

          state.selectedCategory = null;
          updateHeader();
          renderCategories();

          el.categoryScreen.classList.remove('hidden');
          el.categoryScreen.classList.add('fading-out');

          const targetCard = el.categoryList.querySelector(`.cat-banner[data-cat-id="${CSS.escape(prevCat.id)}"]`);
          const targetTitle = targetCard ? targetCard.querySelector('.cat-title') : null;

          requestAnimationFrame(() => {
            if (targetTitle) {
              const targetRect = targetTitle.getBoundingClientRect();
              targetTitle.classList.add('invisible-shared');
              animateSharedTitle(displayCategoryTitle(prevCat), headerRect, targetRect, 1, 23 / 22, () => {
                targetTitle.classList.remove('invisible-shared');
              });
            }
            el.categoryScreen.classList.remove('fading-out');
          });

          setTimeout(() => { state.isTransitioning = false; }, 360);
        }, 140);
      }

      // --- Data Loading ---
      async function loadAppConfig() {
        loadDownloadedIds();
        const cached = getCachedConfig();

        if (cached && cached.categories.length > 0) {
          applyAppConfig(cached);
        } else {
          renderCategoryShimmers();
        }

        try {
          const res = await fetch(APP_CONFIG_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error('Network error');
          const rawText = await res.text();
          const netConfig = parseAppConfig(rawText);

          const shouldUpdate = !cached || netConfig.version >= cached.version;
          if (shouldUpdate) {
            saveCachedConfig(rawText);
            applyAppConfig(netConfig);
          } else {
            state.appConfig.maintenanceMode = netConfig.maintenanceMode;
            state.appConfig.maintenanceMessage = netConfig.maintenanceMessage;
            syncMaintenanceView();
          }
        } catch {
          if (!cached || cached.categories.length === 0) {
            el.categoryList.innerHTML = '';
            el.categoryToolbar.classList.add('hidden');
            el.configErrorView.classList.remove('hidden');
          }
        }
      }

      function syncMaintenanceView() {
        const maint = state.appConfig.maintenanceMode;
        el.maintenanceView.classList.toggle('hidden', !maint);
        el.mainStage.classList.toggle('hidden', maint);
        el.maintenanceMsg.textContent =
          state.appConfig.maintenanceMessage || 'ସର୍ଭର ମେଣ୍ଟେନାନ୍ସ ଚାଲିଛି...';
      }

      function applyAppConfig(cfg) {
        state.appConfig = cfg;
        state.activeCategories = cfg.categories.filter(c => !cfg.hiddenTabs.includes(c.id));
        syncMaintenanceView();
        if (!cfg.maintenanceMode) {
          renderCategories();
          fetchAllCategoryPreviews();
        }
      }

      function fetchAllCategoryPreviews() {
        state.activeCategories.forEach(async cat => {
          const cached = getCachedCategory(cat.id);
          if (cached && cached.items.length > 0) {
            state.previews[cat.id] = {
              firstImage: cached.items[0].image || '',
              itemCount: cached.items.length
            };
            updateSingleCategoryBanner(cat.id);
          }

          const net = await fetchCategoryNetwork(cat);
          if (net && net.items.length > 0) {
            if (!cached || cached.items.length === 0) {
              saveCachedCategory(cat.id, net.rawJson);
            }
            state.previews[cat.id] = {
              firstImage: net.items[0].image || '',
              itemCount: net.items.length
            };
            updateSingleCategoryBanner(cat.id);
          }
        });
      }

      async function loadCategoryItems(category) {
        state.isLoadingItems = true;
        state.isUpdateAvailable = false;
        state.latestNetworkData = null;
        el.updateFab.classList.remove('visible');
        renderItemsGrid();

        const cached = getCachedCategory(category.id);
        if (cached && cached.items.length > 0) {
          state.itemsList = cached.items;
          state.isLoadingItems = false;
          renderItemsGrid();
        }

        const net = await fetchCategoryNetwork(category);
        if (state.selectedCategory?.id !== category.id) return;

        if (net) {
          if (!cached || cached.items.length === 0) {
            state.itemsList = net.items;
            state.isLoadingItems = false;
            saveCachedCategory(category.id, net.rawJson);
            state.previews[category.id] = {
              firstImage: net.items[0]?.image || '',
              itemCount: net.items.length
            };
            renderItemsGrid();
          } else if (net.version > cached.version) {
            state.latestNetworkData = net;
            state.isUpdateAvailable = true;
            el.updateFab.classList.add('visible');
          }
        } else {
          state.isLoadingItems = false;
          renderItemsGrid();
        }
      }

            ghost.style.left = `${srcRect.left}px`;
            ghost.style.top = `${srcRect.top}px`;
            ghost.style.width = `${srcRect.width}px`;
            ghost.style.height = `${srcRect.height}px`;

          el.detailOverlay.classList.remove('visible');
          setTimeout(() => {
            el.detailOverlay.classList.remove('open');

            state.activeItem = null;
            state.sourceImgEl = null;
          }, 260);

      // --- Full-Screen Zoom-Anywhere Viewer (Pinch, Pan, Wheel & Double-Tap) ---
      const zoom = {
        scale: 1,
        x: 0,
        y: 0,
        pointers: new Map(),
        startDist: 0,
        startScale: 1,
        lastMid: null,
        lastTapTime: 0,
        lastTapPos: { x: 0, y: 0 },
        dragMoved: false
      };

      function clampZoomOffset(nx, ny, s) {
        if (s <= 1) return { x: 0, y: 0 };
        const maxX = (window.innerWidth * (s - 1)) / 2;
        const maxY = (window.innerHeight * (s - 1)) / 2;
        return {
          x: Math.max(-maxX, Math.min(maxX, nx)),
          y: Math.max(-maxY, Math.min(maxY, ny))
        };
      }

      function applyZoomTransform(animated = false) {
        el.zoomImg.style.transition = animated ? 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
        el.zoomImg.style.transform = `translate3d(${zoom.x}px, ${zoom.y}px, 0) scale(${zoom.scale})`;
      }

      function openZoomViewer() {
        if (!state.activeItem || !state.activeItem.image) return;
        state.isZoomOpen = true;
        zoom.scale = 1;
        zoom.x = 0;
        zoom.y = 0;
        zoom.pointers.clear();

        el.zoomImg.src = state.activeItem.image;
        el.zoomImg.alt = state.activeItem.odiaName;
        el.zoomImg.style.transition = 'none';
        el.zoomImg.style.transform = 'scale(0.86)';

        el.zoomOverlay.classList.add('open');
        history.pushState({ view: 'zoom' }, '');

        requestAnimationFrame(() => {
          el.zoomOverlay.classList.add('visible');
          applyZoomTransform(true);
        });
      }

      function closeZoomViewer() {
        if (!state.isZoomOpen) return;
        state.isZoomOpen = false;
        el.zoomOverlay.classList.remove('visible');
        setTimeout(() => {
          el.zoomOverlay.classList.remove('open');
          zoom.scale = 1;
          zoom.x = 0;
          zoom.y = 0;
        }, 240);
      }

      function zoomAtPoint(clientX, clientY, targetScale) {
        const clampedScale = Math.max(1, Math.min(4.5, targetScale));
        if (clampedScale <= 1.01) {
          zoom.scale = 1;
          zoom.x = 0;
          zoom.y = 0;
          applyZoomTransform(true);
          return;
        }
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const fx = clientX - cx;
        const fy = clientY - cy;
        const factor = clampedScale / zoom.scale;
        const rawX = (zoom.x - fx) * factor + fx;
        const rawY = (zoom.y - fy) * factor + fy;
        const clamped = clampZoomOffset(rawX, rawY, clampedScale);
        zoom.scale = clampedScale;
        zoom.x = clamped.x;
        zoom.y = clamped.y;
        applyZoomTransform(true);
      }

      el.zoomOverlay.addEventListener('pointerdown', e => {
        if (e.target.closest('.zoom-close')) return;
        el.zoomOverlay.setPointerCapture(e.pointerId);
        zoom.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        zoom.dragMoved = false;

        if (zoom.pointers.size === 2) {
          const pts = [...zoom.pointers.values()];
          zoom.startDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          zoom.startScale = zoom.scale;
          zoom.lastMid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        } else if (zoom.pointers.size === 1) {
          zoom.lastMid = { x: e.clientX, y: e.clientY };
        }
      });

      el.zoomOverlay.addEventListener('pointermove', e => {
        if (!zoom.pointers.has(e.pointerId)) return;
        const prev = zoom.pointers.get(e.pointerId);
        zoom.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (zoom.pointers.size === 2) {
          zoom.dragMoved = true;
          const pts = [...zoom.pointers.values()];
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          if (zoom.startDist > 0) {
            const newScale = Math.max(1, Math.min(4.5, zoom.startScale * (dist / zoom.startDist)));
            const factor = newScale / zoom.scale;
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const dx = zoom.lastMid ? mid.x - zoom.lastMid.x : 0;
            const dy = zoom.lastMid ? mid.y - zoom.lastMid.y : 0;
            const fx = mid.x - cx;
            const fy = mid.y - cy;
            const clamped = clampZoomOffset(
              (zoom.x + dx - fx) * factor + fx,
              (zoom.y + dy - fy) * factor + fy,
              newScale
            );
            zoom.scale = newScale;
            zoom.x = clamped.x;
            zoom.y = clamped.y;
            applyZoomTransform(false);
          }
          zoom.lastMid = mid;
        } else if (zoom.pointers.size === 1 && zoom.scale > 1.01) {
          const dx = e.clientX - prev.x;
          const dy = e.clientY - prev.y;
          if (Math.hypot(dx, dy) > 2) zoom.dragMoved = true;
          const clamped = clampZoomOffset(zoom.x + dx, zoom.y + dy, zoom.scale);
          zoom.x = clamped.x;
          zoom.y = clamped.y;
          applyZoomTransform(false);
        }
      });

      el.zoomOverlay.addEventListener('pointerup', e => {
        if (!zoom.pointers.has(e.pointerId)) return;
        zoom.pointers.delete(e.pointerId);

        if (zoom.pointers.size === 0 && !zoom.dragMoved) {
          const now = Date.now();
          const tapDist = Math.hypot(e.clientX - zoom.lastTapPos.x, e.clientY - zoom.lastTapPos.y);
          if (now - zoom.lastTapTime < 280 && tapDist < 40) {
            zoom.lastTapTime = 0;
            if (zoom.scale > 1.08) {
              zoomAtPoint(e.clientX, e.clientY, 1);
            } else {
              zoomAtPoint(e.clientX, e.clientY, 2.6);
            }
          } else {
            zoom.lastTapTime = now;
            zoom.lastTapPos = { x: e.clientX, y: e.clientY };
          }
        }
      });

      el.zoomOverlay.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 1.18 : 0.85;
        zoomAtPoint(e.clientX, e.clientY, zoom.scale * delta);
      }, { passive: false });

      // --- Download / Delete Dialogs & Offline Jobs ---
      function openDialog({ title, titleColor, desc, buttons }) {
        el.dialogTitle.textContent = title;
        el.dialogTitle.style.color = titleColor || 'var(--text)';
        el.dialogDesc.textContent = desc;
        el.dialogActions.innerHTML = '';

        buttons.forEach(btn => {
          const b = document.createElement('button');
          b.className = `dialog-btn ${btn.cls}`;
          b.textContent = btn.label;
          b.onclick = () => { closeDialog(); btn.onClick(); };
          el.dialogActions.appendChild(b);
        });

        el.actionDialog.classList.add('open');
        requestAnimationFrame(() => el.actionDialog.classList.add('visible'));
      }

      function closeDialog() {
        el.actionDialog.classList.remove('visible');
        setTimeout(() => el.actionDialog.classList.remove('open'), 220);
      }

      function setDownloadBanner(visible, text = '', pct = 0) {
        state.isDownloading = visible;
        el.dlBannerWrap.classList.toggle('visible', visible);
        if (visible) {
          el.dlStatusText.textContent = text || 'ଡାଉନଲୋଡ୍ ଚାଲିଛି...';
          const p = Math.round(pct * 100);
          el.dlPctText.textContent = `${toOdia(p)}%`;
          el.dlProgressFill.style.width = `${p}%`;
        }
        renderCategoryOfflinePill();
        renderGridOfflinePill();
      }

      async function downloadSingleCategory(cat) {
        setDownloadBanner(true, `${displayCategoryTitle(cat)} ସେଭ୍ ହେଉଛି...`, 0);
        const net = await fetchCategoryNetwork(cat);
        let items = state.itemsList;
        if (net) {
          saveCachedCategory(cat.id, net.rawJson);
          items = net.items;
        }
        const total = Math.max(items.length, 1);
        for (let i = 0; i < items.length; i++) {
          if (items[i].image) await cacheImageOffline(items[i].image);
          setDownloadBanner(true, `${displayCategoryTitle(cat)} ସେଭ୍ ହେଉଛି...`, (i + 1) / total);
        }
        state.downloadedIds.add(cat.id);
        saveDownloadedIds();
        setTimeout(() => {
          setDownloadBanner(false);
          if (!state.selectedCategory) renderCategories();
        }, 350);
      }

      async function downloadAllCategories() {
        const cats = [...state.activeCategories];
        setDownloadBanner(true, 'ସବୁ ବିଭାଗ ପ୍ରସ୍ତୁତ ହେଉଛି...', 0);
        const bundles = [];

        for (const cat of cats) {
          setDownloadBanner(true, `${displayCategoryTitle(cat)} ତଥ୍ୟ ଅଣାଯାଉଛି...`, 0);
          const net = await fetchCategoryNetwork(cat);
          const data = net ? (saveCachedCategory(cat.id, net.rawJson), net) : getCachedCategory(cat.id);
          if (data) bundles.push({ cat, items: data.items });
        }

        const total = Math.max(bundles.reduce((s, b) => s + b.items.length, 0), 1);
        let done = 0;
        for (const b of bundles) {
          for (const item of b.items) {
            if (item.image) await cacheImageOffline(item.image);
            done++;
            setDownloadBanner(true, `${displayCategoryTitle(b.cat)} ଡାଉନଲୋଡ୍ ହେଉଛି...`, done / total);
          }
          state.downloadedIds.add(b.cat.id);
        }
        saveDownloadedIds();
        setTimeout(() => {
          setDownloadBanner(false);
          if (!state.selectedCategory) renderCategories();
        }, 350);
      }

      function openDownloadDialog() {
        const cat = state.selectedCategory;
        const buttons = [];
        if (cat) {
          const estMB = toOdia((state.itemsList.length * 0.15).toFixed(1));
          buttons.push({
            label: `କେବଳ ${cat.title} (~${estMB} ଏମବି)`,
            cls: 'btn-orange',
            onClick: () => downloadSingleCategory(cat)
          });
        }
        buttons.push({
          label: '🌟 ସବୁ ବିଭାଗ ଡାଉନଲୋଡ୍ କରନ୍ତୁ',
          cls: cat ? 'btn-brown' : 'btn-orange',
          onClick: downloadAllCategories
        });

        openDialog({
          title: 'ଅଫଲାଇନ୍ ଡାଉନଲୋଡ୍ 📥',
          desc: cat
            ? `ବିନା ଇଣ୍ଟରନେଟରେ ପଢ଼ିବା ପାଇଁ ଆପଣ କେବଳ '${cat.title}' କିମ୍ବା ସବୁ ବିଭାଗ ଏକାଠି ସେଭ୍ କରିପାରିବେ।`
            : 'ବିନା ଇଣ୍ଟରନେଟରେ ପଢ଼ିବା ପାଇଁ ସବୁ ବିଭାଗର ଫଟୋ ଏବଂ ତଥ୍ୟ ସେଭ୍ କରିବାକୁ ଚାହୁଁଛନ୍ତି କି?',
          buttons
        });
      }

      function openDeleteDialog() {
        const cat = state.selectedCategory;
        if (!cat) return;
        openDialog({
          title: 'ଡିଲିଟ୍ କରନ୍ତୁ 🗑️',
          titleColor: 'var(--red)',
          desc: `ଆପଣ କେବଳ '${cat.title}' କିମ୍ବା ସବୁ ବିଭାଗର ଅଫଲାଇନ୍ ଫଟୋ ଡିଲିଟ୍ କରିବାକୁ ଚାହୁଁଛନ୍ତି କି?`,
          buttons: [
            {
              label: `କେବଳ ${cat.title} ଡିଲିଟ୍`,
              cls: 'btn-red',
              onClick: async () => {
                if ('caches' in window) {
                  const cache = await caches.open(CACHE_NAME);
                  for (const it of state.itemsList) {
                    if (it.image) await cache.delete(it.image);
                  }
                }
                state.downloadedIds.delete(cat.id);
                saveDownloadedIds();
                renderGridOfflinePill();
              }
            },
            {
              label: 'ସବୁ ଅଫଲାଇନ୍ ଡାଟା ଡିଲିଟ୍',
              cls: 'btn-red-outline',
              onClick: async () => {
                if ('caches' in window) await caches.delete(CACHE_NAME);
                state.downloadedIds.clear();
                saveDownloadedIds();
                renderGridOfflinePill();
              }
            }
          ]
        });
      }

      // --- Event Listeners ---
      function handleStepBack() {
        if (state.isZoomOpen) {
          closeZoomViewer();
        } else if (state.activeItem) {
          closeDetailModal();
        } else if (state.isSearchActive) {
          state.isSearchActive = false;
          state.searchQuery = '';
          el.searchInput.value = '';
          updateHeader();
          renderItemsGrid();
        } else if (state.selectedCategory) {
          goBackToCategoryList();
        }
      }

      el.backBtn.addEventListener('click', handleStepBack);

      el.searchBtn.addEventListener('click', () => {
        state.isSearchActive = true;
        updateHeader();
        setTimeout(() => el.searchInput.focus(), 60);
      });

      el.searchInput.addEventListener('input', e => {
        state.searchQuery = e.target.value;
        el.searchClearBtn.classList.toggle('visible', state.searchQuery.length > 0);
        renderItemsGrid();
      });

      el.searchClearBtn.addEventListener('click', () => {
        state.searchQuery = '';
        el.searchInput.value = '';
        el.searchClearBtn.classList.remove('visible');
        renderItemsGrid();
        el.searchInput.focus();
      });

      el.retryConfigBtn.addEventListener('click', loadAppConfig);

      el.updateFab.addEventListener('click', () => {
        if (!state.latestNetworkData || !state.selectedCategory) return;
        const fresh = state.latestNetworkData;
        state.itemsList = fresh.items;
        state.isUpdateAvailable = false;
        state.latestNetworkData = null;
        el.updateFab.classList.remove('visible');
        saveCachedCategory(state.selectedCategory.id, fresh.rawJson);
        state.previews[state.selectedCategory.id] = {
          firstImage: fresh.items[0]?.image || '',
          itemCount: fresh.items.length
        };
        renderItemsGrid();
      });

      el.detailBackdrop.addEventListener('click', closeDetailModal);
      el.detailCloseBtn.addEventListener('click', closeDetailModal);
      el.detailHero.addEventListener('click', openZoomViewer);
      el.detailScroll.addEventListener('scroll', syncScrollDownFab, { passive: true });
      el.scrollDownFab.addEventListener('click', () => {
        el.detailScroll.scrollTo({ top: el.detailScroll.scrollHeight, behavior: 'smooth' });
      });

      el.zoomCloseBtn.addEventListener('click', closeZoomViewer);
      el.dialogCancelBtn.addEventListener('click', closeDialog);
      el.actionDialog.addEventListener('click', e => {
        if (e.target === el.actionDialog) closeDialog();
      });

      window.addEventListener('popstate', handleStepBack);
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape') handleStepBack();
      });

      // --- Boot ---
      updateHeader();
      loadAppConfig();
    })();
  </script>
</body>
</html>
